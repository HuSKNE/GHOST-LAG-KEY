<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHOST LAG | Access Denied</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#020607;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;

    background:
        radial-gradient(circle at 50% 35%, rgba(0,255,145,.08), transparent 25%),
        radial-gradient(circle at 15% 45%, rgba(0,255,145,.04), transparent 25%),
        radial-gradient(circle at 85% 65%, rgba(0,255,145,.04), transparent 25%);
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:.12;

    background-image:
        linear-gradient(rgba(0,255,145,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,145,.08) 1px,transparent 1px);

    background-size:45px 45px;
}

/* ================= SNOW / PARTICLES ================= */

.particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
}

.particle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#fff;
    opacity:.7;
    box-shadow:0 0 10px rgba(255,255,255,.8);
    animation:float 7s linear infinite;
}

.p1{left:15%;top:25%;animation-delay:-1s;}
.p2{left:49%;top:33%;animation-delay:-4s;}
.p3{left:70%;top:29%;animation-delay:-2s;}
.p4{left:11%;top:61%;animation-delay:-5s;}
.p5{left:82%;top:57%;animation-delay:-3s;}
.p6{left:50%;top:78%;animation-delay:-6s;}
.p7{left:18%;top:88%;animation-delay:-2.5s;}

@keyframes float{
    0%{
        transform:translateY(0);
        opacity:.15;
    }
    30%{
        opacity:.8;
    }
    100%{
        transform:translateY(100px);
        opacity:.05;
    }
}

/* ================= MAIN ================= */

.page{
    position:relative;
    z-index:2;

    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    /* IMPORTANT:
       content ko upar rakha gaya hai */
    padding:8px 15px 35px;
}

.wrapper{
    width:100%;
    max-width:540px;
    margin:0 auto;
}

/* ================= HEADER ================= */

.header{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:8px;
    margin-bottom:28px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brandLogo{
    width:62px;
    height:62px;

    object-fit:cover;
    border-radius:50%;

    border:1px solid rgba(0,255,145,.55);

    background:#050909;

    padding:4px;

    filter:
        brightness(1.35)
        contrast(1.15);

    box-shadow:
        0 0 20px rgba(0,255,145,.18),
        inset 0 0 12px rgba(0,255,145,.08);
}

.brandName{
    font-size:21px;
    font-weight:800;
    letter-spacing:3px;
    line-height:1.1;
}

.brandSub{
    margin-top:6px;

    font-size:11px;
    letter-spacing:3px;

    color:#737d7a;
}

/* ================= STATUS ================= */

.status{
    display:flex;
    align-items:center;
    gap:9px;

    padding:12px 17px;

    border-radius:30px;

    border:1px solid rgba(0,255,145,.2);

    background:rgba(0,255,145,.07);

    box-shadow:
        0 0 20px rgba(0,255,145,.06),
        inset 0 0 15px rgba(0,255,145,.03);
}

.statusDot{
    width:11px;
    height:11px;
    border-radius:50%;

    background:#00ff91;

    box-shadow:
        0 0 8px #00ff91,
        0 0 18px rgba(0,255,145,.65);

    animation:pulse 1.7s infinite;
}

.statusText{
    color:#7affbd;

    font-size:12px;
    font-weight:800;

    letter-spacing:2px;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.5;
        transform:scale(.82);
    }
}

/* ================= HERO ================= */

.hero{
    text-align:center;

    margin-top:0;
    margin-bottom:34px;
}

.heroIcon{
    width:122px;
    height:122px;

    display:block;

    margin:0 auto 25px;

    object-fit:cover;

    border-radius:50%;

    border:3px solid #00ff91;

    background:#020404;

    padding:5px;

    filter:
        brightness(1.3)
        contrast(1.15);

    box-shadow:
        0 0 0 1px rgba(0,255,145,.12),
        0 0 25px rgba(0,255,145,.24),
        0 0 65px rgba(0,255,145,.13);
}

.heroTitle{
    font-size:48px;
    font-weight:900;

    letter-spacing:8px;
    line-height:1;

    text-transform:uppercase;

    text-shadow:
        0 0 25px rgba(0,255,145,.08);
}

.heroTitle span{
    color:#00ff91;

    text-shadow:
        0 0 18px rgba(0,255,145,.35),
        0 0 40px rgba(0,255,145,.12);
}

.heroSub{
    margin-top:19px;

    color:#7b8783;

    font-size:12px;
    font-weight:700;

    letter-spacing:4px;
}

/* ================= DENIED PANEL ================= */

.panel{
    position:relative;

    width:100%;

    padding:52px 42px 48px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(7,13,13,.96),
            rgba(2,7,7,.98)
        );

    border:1px solid rgba(255,76,76,.28);

    box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        0 0 35px rgba(0,255,145,.035);

    overflow:hidden;
}

.panel::before{
    content:"";

    position:absolute;

    width:230px;
    height:230px;

    top:-120px;
    right:-80px;

    border-radius:50%;

    background:rgba(0,255,145,.08);

    filter:blur(45px);

    pointer-events:none;
}

.panel::after{
    content:"";

    position:absolute;
    left:12%;
    right:12%;
    bottom:-80px;

    height:130px;

    background:rgba(0,255,145,.06);

    filter:blur(50px);

    pointer-events:none;
}

/* ================= WARNING ================= */

.warning{
    position:relative;
    z-index:2;

    text-align:center;
}

.warningIcon{
    font-size:76px;

    line-height:1;

    margin-bottom:28px;

    filter:
        drop-shadow(0 0 12px rgba(255,174,0,.15));
}

.warningTitle{
    font-size:31px;

    font-weight:900;

    letter-spacing:.5px;

    margin-bottom:18px;
}

.warningText{
    max-width:450px;

    margin:0 auto;

    color:#858d8b;

    font-size:16px;

    line-height:1.65;
}

/* ================= BUTTON ================= */

.returnBtn{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;

    min-height:76px;

    margin-top:31px;

    border:none;
    outline:none;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            #00ff91,
            #00df7b
        );

    color:#00140b;

    font-size:17px;

    font-weight:900;

    letter-spacing:4px;

    cursor:pointer;

    box-shadow:
        0 12px 35px rgba(0,255,145,.16);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;

    overflow:hidden;
}

.returnBtn::before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:60%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );

    transform:skewX(-20deg);

    animation:shine 3.5s infinite;
}

@keyframes shine{
    0%{
        left:-100%;
    }

    45%,100%{
        left:150%;
    }
}

.returnBtn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 16px 45px rgba(0,255,145,.25);

    filter:brightness(1.05);
}

.returnBtn:active{
    transform:scale(.98);
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;

    margin-top:25px;

    color:#46504d;

    font-size:10px;

    letter-spacing:2px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .page{
        padding:6px 15px 30px;
    }

    .header{
        margin-top:4px;
        margin-bottom:25px;
    }

    .brand{
        gap:10px;
    }

    .brandLogo{
        width:58px;
        height:58px;
    }

    .brandName{
        font-size:18px;
        letter-spacing:2.5px;
    }

    .brandSub{
        font-size:9px;
        letter-spacing:2.2px;
    }

    .status{
        padding:10px 13px;
    }

    .statusText{
        font-size:10px;
        letter-spacing:1.5px;
    }

    .statusDot{
        width:9px;
        height:9px;
    }

    .hero{
        margin-bottom:29px;
    }

    .heroIcon{
        width:112px;
        height:112px;

        margin-bottom:22px;
    }

    .heroTitle{
        font-size:40px;
        letter-spacing:6px;
    }

    .heroSub{
        font-size:10px;
        letter-spacing:3px;
        margin-top:16px;
    }

    .panel{
        padding:45px 24px 40px;
        border-radius:24px;
    }

    .warningIcon{
        font-size:68px;
        margin-bottom:23px;
    }

    .warningTitle{
        font-size:28px;
    }

    .warningText{
        font-size:15px;
        line-height:1.6;
    }

    .returnBtn{
        min-height:68px;

        border-radius:22px;

        font-size:15px;
        letter-spacing:3px;
    }
}

/* ================= SMALL PHONES ================= */

@media(max-width:380px){

    .page{
        padding:4px 12px 25px;
    }

    .header{
        margin-bottom:21px;
    }

    .brandLogo{
        width:51px;
        height:51px;
    }

    .brandName{
        font-size:16px;
        letter-spacing:2px;
    }

    .brandSub{
        font-size:8px;
        letter-spacing:1.7px;
    }

    .status{
        padding:8px 10px;
    }

    .statusText{
        font-size:9px;
    }

    .heroIcon{
        width:96px;
        height:96px;

        margin-bottom:19px;
    }

    .heroTitle{
        font-size:33px;
        letter-spacing:5px;
    }

    .heroSub{
        font-size:9px;
        letter-spacing:2.3px;
    }

    .panel{
        padding:37px 19px 32px;
        border-radius:21px;
    }

    .warningIcon{
        font-size:60px;
    }

    .warningTitle{
        font-size:25px;
    }

    .warningText{
        font-size:14px;
    }

    .returnBtn{
        min-height:63px;

        border-radius:19px;

        font-size:13px;
        letter-spacing:2.5px;
    }
}

/* ================= SHORT SCREEN ================= */

@media(max-height:700px){

    .page{
        padding-top:3px;
    }

    .header{
        margin-top:2px;
        margin-bottom:18px;
    }

    .hero{
        margin-bottom:20px;
    }

    .heroIcon{
        width:85px;
        height:85px;
        margin-bottom:14px;
    }

    .heroTitle{
        font-size:29px;
    }

    .heroSub{
        margin-top:10px;
    }

    .panel{
        padding-top:30px;
        padding-bottom:28px;
    }

    .warningIcon{
        font-size:52px;
        margin-bottom:15px;
    }

    .warningTitle{
        margin-bottom:10px;
        font-size:23px;
    }

    .warningText{
        font-size:13px;
    }

    .returnBtn{
        margin-top:20px;
        min-height:55px;
    }
}
</style>
</head>

<body>

<!-- PARTICLES -->
<div class="particles">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
</div>

<main class="page">

    <div class="wrapper">

        <!-- HEADER -->
        <header class="header">

            <div class="brand">

                <img
                    src="./assets/logo.png"
                    class="brandLogo"
                    alt="GHOST LAG"
                >

                <div>
                    <div class="brandName">
                        GHOST LAG
                    </div>

                    <div class="brandSub">
                        KEY GENERATION SYSTEM
                    </div>
                </div>

            </div>

            <div class="status">
                <span class="statusDot"></span>
                <span class="statusText">ONLINE</span>
            </div>

        </header>


        <!-- HERO -->
        <section class="hero">

            <img
                src="./assets/logo.png"
                class="heroIcon"
                alt="GHOST LAG"
            >

            <h1 class="heroTitle">
                <span>GHOST</span> LAG
            </h1>

            <div class="heroSub">
                SECURE ACCESS • DEVICE KEY
            </div>

        </section>


        <!-- ACCESS DENIED -->
        <section class="panel">

            <div class="warning">

                <div class="warningIcon">
                    ⚠️
                </div>

                <h2 class="warningTitle">
                    ACCESS DENIED
                </h2>

                <p class="warningText">
                    Please complete the required steps before accessing
                    the key generation system.
                </p>

                <button
                    class="returnBtn"
                    onclick="returnToSteps()"
                >
                    RETURN TO STEPS
                </button>

            </div>

        </section>


        <!-- FOOTER -->
        <div class="footer">
            GHOST LAG • SECURE KEY SYSTEM
        </div>

    </div>

</main>


<script>
function returnToSteps(){
    window.location.href = "steps.html";
}
</script>

</body>
</html>
